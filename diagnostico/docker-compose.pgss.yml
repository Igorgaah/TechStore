# Override usado SÓ pelo diagnostico/coletar.sh, durante a carga de diagnóstico.
# Liga a extensão pg_stat_statements (precisa de shared_preload_libraries) para saber
# quais consultas consomem o tempo do banco. As medições de antes/depois (scripts/medir.sh)
# nunca rodam com este arquivo: o coletor volta o banco para o docker-compose.yml normal no fim.
services:
  banco:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_connections=on
